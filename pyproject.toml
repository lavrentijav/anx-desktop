[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anx-desktop"
version = "0.1.0"
description = "Unofficial desktop anime client"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "respx>=0.21",
    "pytest>=8",
]

release = [
    "Nuitka==4.3.5",
    "ordered-set>=4.1",
    "patchelf>=0.19; sys_platform == 'linux'",
]

[project.scripts]
anx-desktop = "anx_desktop.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anx_desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
